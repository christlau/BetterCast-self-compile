name: Build Android Receiver APK

on:
  push:
    paths:
      - 'Sources/BetterCastReceiverAndroid/**'
      - '.github/workflows/build-android-receiver.yml'
  workflow_dispatch:

concurrency:
  group: android-receiver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set ANDROID_HOME
        run: echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Accept SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('Sources/BetterCastReceiverAndroid/**/*.gradle.kts', 'Sources/BetterCastReceiverAndroid/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Build debug APK
        working-directory: Sources/BetterCastReceiverAndroid
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterCastReceiver-Android-debug
          path: Sources/BetterCastReceiverAndroid/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
